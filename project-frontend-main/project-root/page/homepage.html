<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="icon" type="image/png" href="../assets/images/logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/home.css" />
  </head>
  <body class="body-page">
    <header class="header-page">
      <nav>
        <button id="btn-menu">
          <img src="../assets/icons/btn-menu.png" alt="" />
        </button>
        <p>
          <span id="username"></span>
          <img src="../assets/images/avatar-facebook-nam-vo-danh.jpeg" alt="" />
        </p>
      </nav>
      <hr />
      <div>
        <p>Recipes</p>
        <p>Create, check and update recipes</p>
      </div>
    </header>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <img src="../assets/images/images-removebg-preview 1.png" alt="" />
      </div>
      <div class="sidebar-list-index">
        <ul class="sidebar-list">
          <li style="background-color: #293846">
            <img src="/assets/icons/icon-home-sidebar-color.png" alt="" />
            <a href="homepage.html" style="color: #ffffff">Homepage</a>
          </li>
          <li>
            <img src="/assets/icons/icon-food-sidebar.png" alt="" />
            <a href="foods.html">Foods</a>
          </li>
          <li>
            <img src="/assets/icons/icon-recipes-sidebar.png" alt="" />
            <a href="recipes.html">Recipes</a>
          </li>
        </ul>
        <div class="sign-out-list">
          <img src="../assets/icons/icon-sign-out-sidebar.png" alt="" />
          <a href="../index.html">Sign Out</a>
        </div>
      </div>
    </aside>

    <section>
      <b>Recipes</b>
      <p>Search, check and create new recipes</p>
      <div class="search">
        <input class="search_food" type="text" placeholder="Search food" />
        <div class="custom_input">
          <button>
            <img src="../assets/icons/btn-soft-up-food.png" alt="" />
            <select id="sort-nutrient" name="nutrient">
              <option value="">Sort by nutrient</option>
              <option value="energy">Energy</option>
              <option value="fat">Fat</option>
              <option value="carbohydrate">Carbohydrate</option>
              <option value="protein">Protein</option>
            </select>
          </button>
        </div>
        <select id="category" name="category">
          <option value="">Category</option>
        </select>
      </div>

      <div class="recip_child"></div>
      <div class="page">
        <div class="list_page">
          <button class="prev-page">
            <img src="../assets/icons/left-icon.png" alt="lui_page" />
          </button>
          <div id="pageNumbers"></div>
          <button class="next-page">
            <img src="../assets/icons/right-icon.png" alt="lui_page" />
          </button>
        </div>
      </div>
    </section>
    <script src="../js/sidebar.js"></script>
    <script src="../js/homepage.js"></script>
    <!-- <script src="../js/recipes.js"></script> -->
  </body>
</html>
